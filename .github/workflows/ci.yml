name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Reject secrets and runtime artifacts
        run: python scripts/security_check.py

      - name: Compile source
        run: python -m compileall -q api core database plugins services ui utils app.py main.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_ci_tests.py
