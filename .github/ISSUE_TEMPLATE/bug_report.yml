name: Bug report
description: Report a reproducible problem in GPT Image Studio
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve GPT Image Studio. Never paste API keys, `.env` contents, or private images."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Click…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "4.8.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version or release archive name
      placeholder: "Python 3.12.4 or GPTImageStudio-Windows-v4.8.0.zip"
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove keys, usernames, paths, prompts, and private asset names before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private data from this report.
          required: true

